name: Validate encrypted album
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tools/*.test.mjs
      - run: node --check unlock.js
      - run: node --check app.js
      - run: node tools/build-service-worker.mjs --check
