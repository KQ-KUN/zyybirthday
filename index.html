<body>
  <section id="unlock-screen" class="unlock-screen" aria-labelledby="unlock-title">
    <div class="unlock-card"><div class="unlock-intro"><h1 id="unlock-title">地图<br>相册。</h1></div>
      <form id="unlock-form" autocomplete="off">
        <label for="unlock-name">姓名或昵称</label><input id="unlock-name" type="text" maxlength="80" required autocomplete="off" autocapitalize="off" spellcheck="false">
        <label for="unlock-birthday">生日月日</label><input id="unlock-birthday" type="text" inputmode="numeric" maxlength="12" placeholder="例如 0518" required autocomplete="off" aria-describedby="unlock-error">
        <p id="unlock-error" class="unlock-error" role="status" aria-live="polite"></p><button id="unlock-submit" class="primary-button" type="submit" disabled>打开相册</button>
      </form></div>
  </section>
  <main id="app" hidden>
    <div id="map" aria-label="回忆地点地图"></div>
    <div class="map-wash" aria-hidden="true"></div>
    <div id="map-notice" class="map-notice" role="status"><span class="loading-dot" aria-hidden="true"></span>正在展开地图</div>

    <aside class="album-sidebar">
    <header class="masthead">
      <div class="title-group"><div><h1 aria-label="昀的旅行地图"><img class="travel-title" src="assets/travel-title.svg" alt="" aria-hidden="true" width="150" height="80"></h1></div></div>
      <div class="header-actions"><button id="map-home" class="round-button" aria-label="回到生日快乐首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7"/></svg></button><button id="upload-open" class="round-button" aria-label="添加照片与本机备份" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button><span id="demo-badge" class="demo-badge">演示版</span><button id="credits-open" class="round-button" aria-label="照片来源" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg></button><button id="letter-open" class="round-button" aria-label="打开生日卡片" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></button></div>
    </header>

      <div class="album-content">
    <section id="place-card" class="place-card" aria-label="选中的地点" hidden>
      <button id="card-photo-retry" class="card-photo-retry" hidden>重试照片</button><div class="place-photo-frame"><button id="place-photo-view" class="place-photo-view" aria-label="全屏查看当前照片" aria-haspopup="dialog"><img id="place-cover" alt="" width="110" height="92"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5m8 0h5v-5"/></svg></button></div>
      <div id="card-photo-nav" class="card-photo-nav"><button id="card-prev" aria-label="地点上一张照片">‹</button><span id="card-counter" aria-live="polite"></span><button id="card-next" aria-label="地点下一张照片">›</button></div>
      <button id="place-card-open" class="place-card-open"><span class="place-copy"><span id="place-region" class="eyebrow"></span><strong id="place-name"></strong><span id="place-count"></span></span><span id="place-index" class="place-index" aria-hidden="true"></span><svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></button>
      <button id="pin-delete" class="pin-delete" aria-label="删除当前地图钉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg></button><button id="place-close" class="card-close" aria-label="收起地点卡片">×</button>
    </section>

    <section class="album-dock" aria-label="相册浏览"><div class="dock-actions"><button id="gallery-open" class="secondary-button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>全部照片</button><button id="tour-button" class="primary-button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6v15H4zM14 2h6v15h-6z"/></svg><span>按地区浏览</span></button><button id="auto-browse" class="auto-browse" aria-pressed="false">一键浏览</button></div></section>
      </div>
    </aside>
    <span id="live-status" class="sr-only" role="status" aria-live="polite"></span>
    <footer class="map-credit"><a href="https://datav.aliyun.com/portal/school/atlas/area_selector" target="_blank" rel="noopener">DataV</a> · <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a></footer>
  </main>

  <dialog id="regions-dialog" class="regions-dialog" aria-labelledby="regions-title"><header class="dialog-header"><div><p id="place-summary" class="eyebrow"></p><h2 id="regions-title">按地区浏览</h2></div><button class="round-button" data-close="regions-dialog" aria-label="收起地区列表">×</button></header><div id="place-strip" class="region-list"></div><footer class="region-options"><button id="map-motion" aria-label="关闭地图移动动画" aria-pressed="true">平滑移动</button></footer></dialog>

  <dialog id="photos-dialog" class="photos-dialog" aria-labelledby="photos-title">
    <header class="dialog-header"><div><p id="photos-subtitle" class="eyebrow"></p><h2 id="photos-title">照片</h2></div><button class="round-button" data-close="photos-dialog" aria-label="关闭照片，回到地图">×</button></header>
    <button id="grid-retry" class="grid-retry">重试未加载的照片</button>
    <div id="photo-grid" class="photo-grid"></div>
  </dialog>

  <dialog id="viewer" class="viewer" aria-labelledby="viewer-caption">
    <header class="viewer-header"><span id="viewer-counter"></span><button class="round-button" data-close="viewer" aria-label="关闭大图">×</button></header>
    <div id="viewer-stage" class="viewer-stage"><img id="viewer-image" alt=""><p id="photo-error" hidden>这张照片暂时无法加载</p><button id="photo-retry" class="photo-retry" hidden>重新加载照片</button><button id="photo-prev" class="viewer-arrow prev" aria-label="上一张照片">‹</button><button id="photo-next" class="viewer-arrow next" aria-label="下一张照片">›</button></div>
    <footer class="viewer-footer"><div id="viewer-copy"><h2 id="viewer-caption"></h2><p id="viewer-note"></p></div><button id="viewer-map" class="viewer-map">在地图上看</button><div id="viewer-dots" class="viewer-dots" aria-label="选择照片"></div></footer>
  </dialog>

  <dialog id="letter-dialog" class="letter-dialog" aria-labelledby="letter-title"><button class="round-button letter-close" data-close="letter-dialog" aria-label="收起生日卡片">×</button><div class="letter-decoration" aria-hidden="true"><svg viewBox="0 0 120 120"><path d="M23 110Q57 78 71 15M46 81Q15 74 21 53Q44 51 48 77M59 58Q86 64 97 38Q69 34 59 55M68 34Q46 25 53 9Q72 10 71 29"/></svg></div><p class="eyebrow">一张生日卡片</p><h2 id="letter-title">生日快乐。</h2><p id="letter-message"></p><p id="letter-signature" class="letter-signature"></p><span class="letter-demo">卡片文字为暂拟，可替换</span></dialog>

  <dialog id="credits-dialog" class="credits-dialog" aria-labelledby="credits-title"><header class="dialog-header"><h2 id="credits-title">照片来源</h2><button class="round-button" data-close="credits-dialog" aria-label="关闭照片来源">×</button></header><p>照片来源与许可记录。</p><div id="credits-list"></div></dialog>
  <dialog id="birthday-intro" class="birthday-intro" aria-labelledby="intro-title"></dialog>
  <dialog id="upload-dialog" class="upload-dialog" aria-labelledby="upload-title">
    <header class="dialog-header"><h2 id="upload-title">添加照片</h2><button class="round-button" data-close="upload-dialog" aria-label="关闭添加照片">×</button></header>
    <p class="local-storage-note">本机保存；清除浏览器数据会丢失，请导出备份。换浏览器或手机后，需重新导入备份。</p>
    <form id="upload-form">
      <label for="upload-photos">照片</label><input id="upload-photos" type="file" accept="image/*" multiple required>
      <label for="upload-name">地点名称</label><input id="upload-name" type="text" maxlength="100" placeholder="例如：西湖春游" required>
      <label for="upload-location">搜索地点（大致位置）</label><div class="location-search"><input id="upload-location" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="location-results" autocomplete="off" placeholder="输入城市、区县或景区名称" required><div id="location-results" class="location-results" role="listbox" aria-label="地点搜索结果" hidden></div></div>
      <button class="primary-button" type="submit">保存照片并生成地图钉</button>
    </form>
    <p id="upload-status" class="upload-status" role="status" aria-live="polite"></p>
    <details id="removed-pins" class="removed-pins" hidden><summary id="removed-pins-summary">已移除的地点</summary><div id="removed-pins-list"></div></details><button id="forget-device" class="forget-device">忘记本机解锁</button><div class="backup-actions"><button id="backup-export" class="secondary-button">导出本机备份</button><button id="backup-import" class="secondary-button">导入备份</button><input id="backup-file" type="file" accept=".mapalbum,application/octet-stream" hidden></div>
  </dialog>
  <dialog id="delete-pin-dialog" class="delete-pin-dialog" aria-labelledby="delete-pin-title"><h2 id="delete-pin-title">删除地图钉？</h2><strong id="delete-pin-name"></strong><p>仅从本机地图移除，照片会保留，可在“添加照片”的已移除地点中恢复。</p><p id="pin-delete-status" role="status"></p><div class="delete-pin-actions"><button class="secondary-button" data-close="delete-pin-dialog">取消</button><button id="pin-delete-confirm" class="primary-button">移除此地图钉</button></div></dialog>
